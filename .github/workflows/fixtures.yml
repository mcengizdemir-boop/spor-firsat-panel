name: Update public fixture calendar
on:
  push:
    branches: [main]
    paths:
      - 'fetch_public_fixtures.py'
      - '.github/workflows/fixtures.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 5,11,17 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public match schedule
        run: python fetch_public_fixtures.py
      - name: Commit changed calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public match calendar"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi

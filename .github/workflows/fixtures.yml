name: Update public fixture calendar
on:
  push:
    branches: [main]
    paths:
      - 'fetch_public_fixtures.py'
      - 'test_football.py'
      - '.github/workflows/fixtures.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 5,11,17 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test football calculations
        run: python -m unittest test_football.py -v
      - name: Commit updated calendar with conflict-safe retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python fetch_public_fixtures.py
            git add fixtures.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh public match calendar"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
